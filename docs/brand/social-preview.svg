<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>Borg Commander</title>
  <defs>
    <radialGradient id="room" cx="640" cy="320" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14162e"/>
      <stop offset="1" stop-color="#05060b"/>
    </radialGradient>
    <radialGradient id="vignette" cx="640" cy="320" r="760" gradientUnits="userSpaceOnUse">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity=".2"/>
    </pattern>
    <linearGradient id="logo-accent" x1="0" y1="0" x2="544" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fafd7"/>
      <stop offset="1" stop-color="#875fd7"/>
    </linearGradient>
    <linearGradient id="subtitle-accent" x1="128" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fafd7"/>
      <stop offset="1" stop-color="#875fd7"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <path id="logo" d="M0 0h96v32h-96zM144 0h96v32h-96zM272 0h96v32h-96zM416 0h96v32h-96zM0 32h32v32h-32zM80 32h32v32h-32zM128 32h32v32h-32zM224 32h32v32h-32zM272 32h32v32h-32zM352 32h32v32h-32zM400 32h32v32h-32zM0 64h96v32h-96zM128 64h32v32h-32zM224 64h32v32h-32zM272 64h96v32h-96zM400 64h32v32h-32zM480 64h48v32h-48zM0 96h32v32h-32zM80 96h32v32h-32zM128 96h32v32h-32zM224 96h32v32h-32zM272 96h32v32h-32zM352 96h32v32h-32zM400 96h32v32h-32zM496 96h32v32h-32zM0 128h96v32h-96zM144 128h96v32h-96zM272 128h32v32h-32zM352 128h32v32h-32zM416 128h96v32h-96z"/>
  </defs>
  <rect width="1280" height="640" fill="url(#room)"/>
  <image href="icon.svg" x="152" y="152" width="336" height="336"/>
  <g transform="translate(584 148)">
    <use href="#logo" fill="url(#logo-accent)" opacity=".55" filter="url(#glow)"/>
    <use href="#logo" fill="#ff3d6e" opacity=".6" x="-4"/>
    <use href="#logo" fill="#3de4ff" opacity=".6" x="4"/>
    <use href="#logo" fill="url(#logo-accent)"/>
    <text x="128 160 192 224 256 288 320 352 384" y="216" font-family="Borg Mono" font-size="26.6" fill="url(#subtitle-accent)">commander</text>
    <g font-family="Borg Mono" font-size="26" fill="#c3c7e0" text-anchor="middle">
      <text x="272" y="300">A two-panel file manager</text>
      <text x="272" y="340">with your shell built in.</text>
    </g>
  </g>
  <rect width="1280" height="640" fill="url(#scanlines)"/>
  <rect width="1280" height="640" fill="url(#vignette)"/>
</svg>
