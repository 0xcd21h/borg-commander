name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: never
      BORG_SCREENSHOTS: ${{ github.workspace }}/target/screenshots
      BORG_TEST_TIMEOUT_SECS: "30"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install shells (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish less

      - name: Install shells (macOS)
        if: runner.os == 'macOS'
        run: brew install fish

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target
          cargo test --workspace --no-fail-fast 2>&1 | tee target/test-output.txt

      - name: Report test failures
        if: failure()
        shell: bash
        run: scripts/report-test-failures.sh target/test-output.txt

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: target/screenshots
          if-no-files-found: ignore
