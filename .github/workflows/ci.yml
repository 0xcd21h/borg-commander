name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-public-content.py

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: never
      BORG_SCREENSHOTS: ${{ github.workspace }}/target/screenshots
      BORG_TEST_TIMEOUT_SECS: "30"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install shells (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish less

      - name: Install the eBPF tools (Linux)
        if: runner.os == 'Linux'
        run: scripts/install-ebpf-tools.sh

      - name: Install shells (macOS)
        if: runner.os == 'macOS'
        run: brew install fish

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo nextest run --workspace --profile ci

      - name: Load the watcher's eBPF programs (Linux)
        if: runner.os == 'Linux'
        run: |
          tests="$(cargo test --locked -p borg-app --bin borg --no-run --message-format=json \
            | jq -r 'select(.target.name == "borg" and .profile.test == true) | .executable')"
          sudo "${tests}" --ignored --exact watch::ebpf::tests::the_programs_load_and_report_a_command_that_ends_at_once

      - name: Report failed and flaky tests
        if: always()
        run: python3 scripts/report-test-failures.py target/nextest/ci/junit.xml

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: target/screenshots
          if-no-files-found: ignore
