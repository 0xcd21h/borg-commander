name: Publish guide

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/GUIDE.md'
      - 'docs/translations/**'
      - 'docs/themes/**'
      - 'docs/showcase/**'
      - 'Cargo.toml'
      - 'scripts/check-public-content.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'Cargo.toml'
      - 'scripts/check-public-content.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check public source
        run: python3 scripts/check-public-content.py
      - name: Build guide and search index
        uses: withastro/action@v6
        with:
          path: website
      - name: Check published content
        run: python3 scripts/check-public-content.py --site website/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
