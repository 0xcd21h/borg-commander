name: Publish Homebrew formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version without the v prefix (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP || '0xcd21h/homebrew-tap' }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check publishing settings
        shell: bash
        run: |
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Use a stable release version such as 0.2.0" >&2
            exit 1
          }
          test -n "${HOMEBREW_TAP_TOKEN}" || {
            echo "Add the HOMEBREW_TAP_TOKEN repository secret first" >&2
            exit 1
          }

      - name: Download release checksums
        run: gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --pattern '*.tar.gz.sha256' --dir dist

      - name: Render and publish the formula
        run: |
          scripts/homebrew-formula.sh "${VERSION}" dist > borg-commander.rb
          scripts/publish-formula.sh borg-commander.rb "${HOMEBREW_TAP}" "v${VERSION}"
