[package]
name                 = "borg-app"
description          = "A terminal-first file commander"
edition.workspace      = true
version.workspace      = true
license.workspace      = true
rust-version.workspace = true

[[bin]]
name = "borg"
path = "src/main.rs"

[dependencies]
borg-i18n = { workspace = true }
borg-archive = { workspace = true }
borg-drives = { workspace = true }
serde_json = { workspace = true }
similar    = { workspace = true }
base64     = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
ureq = { workspace = true }
rusqlite = { workspace = true }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }
memchr = { workspace = true }
regex = { workspace = true }
ignore = { workspace = true }
sysinfo = { workspace = true }
dns-lookup = { workspace = true }
read-process-memory = { workspace = true }
borg-docker = { workspace = true }
borg-git = { workspace = true }
anyhow    = { workspace = true }
borg-core = { workspace = true }
borg-rules = { workspace = true }
borg-gfx  = { workspace = true }
borg-jobs = { workspace = true }
borg-link = { workspace = true }
borg-update = { workspace = true }
borg-term = { workspace = true }
borg-ui   = { workspace = true }
borg-vfs  = { workspace = true }
borg-view = { workspace = true }
crossterm = { workspace = true }
futures   = { workspace = true }
getrandom = { workspace = true }
portable-pty = { workspace = true }
jiff      = { workspace = true }
ratatui   = { workspace = true }
rustix    = { workspace = true }
serde     = { workspace = true }
tokio     = { workspace = true }
tokio-rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
rustls-native-certs = { workspace = true }
rcgen     = { workspace = true }
time      = { workspace = true }
httparse  = { workspace = true }
tempfile  = { workspace = true }
toml      = { workspace = true }
uzers     = { workspace = true }
unicode-width = { workspace = true }
zeroize   = { workspace = true }
borg-watch-ebpf = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
aya              = { workspace = true }
argon2           = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf             = { workspace = true }
linux-keyutils   = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
borg-local-auth    = { workspace = true }
security-framework = { workspace = true }

# The watcher's eBPF programs are built for Linux, on a Linux machine (see build.rs).
[target.'cfg(target_os = "linux")'.build-dependencies]
aya-build = { workspace = true }

[dev-dependencies]
anyhow       = { workspace = true }
argon2       = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf         = { workspace = true }
borg-gfx     = { workspace = true }
borg-testkit = { workspace = true }
borg-relay   = { workspace = true }
crossterm    = { workspace = true }
tokio-tungstenite = { workspace = true }
zip          = { workspace = true }

[lints]
workspace = true
