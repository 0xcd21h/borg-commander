[package]
name = "borg-archive"
description = "Archives for borg-commander: listing, safe unpacking and changing them in place"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
borg-drives  = { workspace = true }
borg-i18n    = { workspace = true }
borg-jobs    = { workspace = true }
jiff         = { workspace = true }
bzip2        = { workspace = true }
flate2       = { workspace = true }
lzma-rust2   = { workspace = true, features = ["encoder"] }
rustix       = { workspace = true }
sevenz-rust2 = { workspace = true, features = ["compress"] }
tar          = { workspace = true }
tempfile     = { workspace = true }
thiserror    = { workspace = true }
zip          = { workspace = true }
zstd         = { workspace = true }

[dev-dependencies]
sevenz-rust2 = { workspace = true, features = ["compress", "util"] }

[lints]
workspace = true
