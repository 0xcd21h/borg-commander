[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
edition      = "2024"
version      = "0.9.6"
license      = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
borg-i18n = { path = "crates/borg-i18n" }
borg-archive = { path = "crates/borg-archive" }
borg-drives = { path = "crates/borg-drives" }
borg-core = { path = "crates/borg-core" }
borg-docker = { path = "crates/borg-docker" }
borg-edit = { path = "crates/borg-edit" }
borg-git = { path = "crates/borg-git" }
borg-gfx  = { path = "crates/borg-gfx" }
borg-jobs = { path = "crates/borg-jobs" }
borg-link = { path = "crates/borg-link" }
borg-local-auth = { path = "crates/borg-local-auth" }
borg-relay = { path = "crates/borg-relay" }
borg-rules = { path = "crates/borg-rules" }
borg-update = { path = "crates/borg-update" }
borg-term = { path = "crates/borg-term" }
borg-testkit = { path = "crates/borg-testkit" }
borg-ui   = { path = "crates/borg-ui" }
borg-vfs  = { path = "crates/borg-vfs" }
borg-view = { path = "crates/borg-view" }
borg-watch-ebpf = { path = "crates/borg-watch-ebpf" }

alacritty_terminal = "0.26"
anyhow             = "1"
crossterm          = { version = "0.29", features = ["event-stream", "serde"] }
futures            = "0.3"
globset            = "0.4"
ignore             = "0.4"
jiff               = "0.2"
portable-pty       = "0.9"
ratatui            = "0.30"
rustix             = { version = "1", features = ["process", "termios", "event", "stdio", "fs", "net", "system"] }
serde              = { version = "1", features = ["derive"] }
thiserror          = "2"
tempfile           = "3"
proptest           = "1"
insta              = "1"
ab_glyph           = "0.2"
image              = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64             = "0.22"
gif                = "0.14"
ureq               = { version = "3", features = ["platform-verifier"] }
flate2             = "1"
tar                = "0.4"
bzip2              = "0.6"
lzma-rust2         = { version = "0.23", default-features = false, features = ["std", "xz", "optimization"] }
sevenz-rust2       = { version = "0.24", default-features = false, features = ["aes256", "bzip2", "deflate", "ppmd", "zstd"] }
zip                = { version = "9", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2", "deflate64", "lzma", "ppmd", "xz", "zstd"] }
zstd               = "0.14"
sha2               = "0.10"
aes-gcm            = "0.10"
chacha20poly1305   = "0.10"
hkdf               = "0.12"
hmac               = "0.12"
zeroize            = "1"
rusqlite           = { version = "0.41", features = ["bundled"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
ropey = "1"
memchr = "2"
regex              = "1"
sysinfo            = { version = "0.39", default-features = false, features = ["system", "network"] }
read-process-memory = "0.2"
serde_json         = "1"
similar            = "2"
dns-lookup         = "4"
snow               = "0.10"
getrandom          = "0.3"
tokio-tungstenite  = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-rustls       = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-acme        = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots", "tokio"] }
rustls-platform-verifier = "0.7"
rustls-native-certs = "0.8"
rcgen              = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
time               = "0.3"
httparse           = "1"
icy_sixel          = "0.7"
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util", "io-std", "net"] }
tokio-stream       = "0.1"
toml               = "1"
unicode-width      = "0.2"
two-face           = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
pulldown-cmark     = "0.13"
boreal             = { version = "1.4", default-features = false, features = ["hash", "object"] }
uzers              = "0.12"
aya                = { version = "0.14", default-features = false }
aya-ebpf           = "0.2"
aya-build          = "0.2"
block2             = { version = "0.6", default-features = false, features = ["std"] }
objc2              = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation   = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
security-framework = { version = "3.7", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug         = "line-tables-only"

[profile.dev.package.regex-automata]
opt-level     = 3

[profile.dev.package.regex-syntax]
opt-level     = 3

[profile.dev.package.fancy-regex]
opt-level     = 3

[profile.release]
lto           = true
codegen-units = 1
strip         = true
