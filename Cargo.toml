[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
edition      = "2024"
version      = "0.4.2"
license      = "MIT"
rust-version = "1.97"

[workspace.dependencies]
borg-i18n = { path = "crates/borg-i18n" }
borg-core = { path = "crates/borg-core" }
borg-git = { path = "crates/borg-git" }
borg-gfx  = { path = "crates/borg-gfx" }
borg-jobs = { path = "crates/borg-jobs" }
borg-update = { path = "crates/borg-update" }
borg-term = { path = "crates/borg-term" }
borg-testkit = { path = "crates/borg-testkit" }
borg-ui   = { path = "crates/borg-ui" }
borg-vfs  = { path = "crates/borg-vfs" }
borg-view = { path = "crates/borg-view" }

alacritty_terminal = "0.26"
anyhow             = "1"
crossterm          = { version = "0.29", features = ["event-stream"] }
futures            = "0.3"
globset            = "0.4"
jiff               = "0.2"
libc               = "0.2"
portable-pty       = "0.9"
ratatui            = "0.30"
rustix             = { version = "1", features = ["process", "termios", "event", "stdio", "fs"] }
serde              = { version = "1", features = ["derive"] }
thiserror          = "2"
tempfile           = "3"
proptest           = "1"
insta              = "1"
ab_glyph           = "0.2"
image              = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64             = "0.22"
gif                = "0.14"
ureq               = { version = "3", features = ["platform-verifier"] }
flate2             = "1"
tar                = "0.4"
sha2               = "0.10"
rusqlite           = { version = "0.38", features = ["bundled"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
memchr = "2"
sysinfo            = { version = "0.39", default-features = false, features = ["system"] }
read-process-memory = "0.2"
serde_json         = "1"
icy_sixel          = "0.7"
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
tokio-stream       = "0.1"
toml               = "1"
unicode-width      = "0.2"
two-face           = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
pulldown-cmark     = "0.13"
uzers              = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto           = true
codegen-units = 1
strip         = true
