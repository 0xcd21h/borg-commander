[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 comes in through syntect, which reads its own bundled syntax and theme dumps with it. No syntect release drops it, and the bincode team considers 1.3.3 complete." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser comes in through ab_glyph, which borg-testkit uses to render test screenshots from the bundled fonts. It is not part of the borg binary." },
    { id = "RUSTSEC-2026-0433", reason = "Affects only parsers with ENABLE_WIKILINKS, which borg-view does not enable. Remove once pulldown-cmark 0.13.6 or newer is 7 days old and locked." },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { crate = "unrar", reason = "The UnRAR license does not fit Borg. RAR archives go through an installed unrar, 7z or bsdtar." },
    { crate = "unrar_sys", reason = "The UnRAR license does not fit Borg. RAR archives go through an installed unrar, 7z or bsdtar." },
]

[bans.workspace-dependencies]
duplicates = "deny"
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
